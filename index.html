<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Modo Pop Accesorios | Catálogo</title>
  <style>
    :root {
      --bg: #faf8f5;
      --panel: #ffffff;
      --border: #e8e2d9;
      --text: #1a1a18;
      --muted: #7a7870;
      --soft: #4a4a45;
      --accent: #b8855a;
      --accent-light: #f5ede3;
      --accent-dark: #8f6440;
      --wa: #25D366;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    /* HERO */
    .hero {
      background: #000;
      text-align: center;
      padding: 18px 20px 14px;
    }
    .logo-wrap { margin: 0; line-height: 0; }
    .logo {
      width: min(78%, 340px);
      height: auto;
      display: inline-block;
    }

    /* BARRA FIJA WHATSAPP */
    .wa-bar {
      background: var(--wa);
      color: white;
      text-align: center;
      padding: 11px 20px;
      font-size: .88rem;
      font-weight: 600;
      letter-spacing: .02em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
    }
    .wa-bar svg { flex-shrink: 0; }
    .wa-bar:hover { background: #1ebe5d; }

    /* CONTENIDO */
    .wrap { max-width: 720px; margin: 0 auto; padding: 28px 14px 60px; }

    .section-title {
      font-size: 1.1rem; font-weight: 700;
      letter-spacing: .04em; margin-bottom: 18px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
      color: var(--text);
    }

    /* FILTROS */
    .tools { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
    .tools input {
      width: 100%; padding: 11px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: white;
      color: var(--text);
      font-size: .95rem;
      outline: none;
    }
    .tools input:focus { border-color: var(--accent); }

    .category-list {
      display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 22px;
    }
    .cat-btn {
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 7px 15px;
      background: white;
      color: var(--soft);
      font-size: .82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all .15s;
    }
    .cat-btn.active, .cat-btn:hover {
      background: var(--text);
      color: white;
      border-color: var(--text);
    }

    /* GRID */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    /* CARD */
    .card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      transition: box-shadow .2s, transform .2s;
    }
    .card:hover { box-shadow: 0 4px 20px rgba(0,0,0,.08); transform: translateY(-2px); }

    .card-img {
      width: 100%; aspect-ratio: 1/1;
      object-fit: cover;
      display: block;
      background: #f0ede8;
    }

    .card-body { padding: 12px 13px 14px; }
    .card-code {
      font-size: .68rem; font-weight: 700;
      letter-spacing: .14em; color: var(--accent);
      margin-bottom: 4px;
    }
    .card h3 {
      font-size: .97rem; font-weight: 700;
      margin-bottom: 4px; line-height: 1.3;
    }
    .card-desc {
      font-size: .82rem; color: var(--muted);
      margin-bottom: 10px; line-height: 1.45;
    }
    .card-price {
      font-size: 1.05rem; font-weight: 700;
      color: var(--text);
    }
    .price-pending {
      font-size: .78rem; color: var(--accent-dark);
      background: var(--accent-light);
      border-radius: 4px; padding: 3px 7px;
      display: inline-block;
    }

    /* BOTÓN WA FLOTANTE */
    .wa-float {
      position: fixed; bottom: 22px; right: 18px;
      width: 56px; height: 56px;
      background: var(--wa);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 16px rgba(37,211,102,.45);
      text-decoration: none;
      z-index: 100;
      transition: transform .2s;
    }
    .wa-float:hover { transform: scale(1.08); }

    .empty { grid-column: 1/-1; text-align: center; color: var(--muted); padding: 30px; font-size: .9rem; }

    footer {
      text-align: center; background: #000;
      color: #7a7870; padding: 20px 16px;
      font-size: .78rem; letter-spacing: .06em;
    }

    @media (min-width: 540px) {
      .grid { grid-template-columns: repeat(3, 1fr); gap: 16px; }
    }
  </style>
</head>

    const products = [
      { code: "P001", name: "Pulsera Raíz", category: "Pulseras", description: "Cuero negro e hilo, con un dije plateado de trazos ondulados. Sobria, firme y con carácter.", price: 6200 },
      { code: "P002", name: "Pulsera Navío", category: "Pulseras", description: "Cuero trenzado marrón con un ancla metálica. Para quienes llevan el mar a donde van.", price: 4300 },
      { code: "P003", name: "Pulsera Eclipse", category: "Pulseras", description: "Cuentas negras brillantes con dos separadores plateados grabados. Ajustable a tu medida.", price: 6700 },
      { code: "P004", name: "Pulsera Vueltas", category: "Pulseras", description: "Varias vueltas de cuero y trenza negra con cierre metálico. Un solo accesorio, mucha presencia.", price: 8800 },
      { code: "C001", name: "Collar Flecha", category: "Collares", description: "Una punta de flecha plateada sobre cordón de gamuza verde. Sencillo y con identidad.", price: 4800 },
      { code: "CM001", name: "Colgante Elementos", category: "Colgantes", description: "Borla marrón, cuentas turquesa y madera. Para mochila, cartera o bolso, con tu toque personal.", price: 7200 },
      { code: "L001", name: "Llavero Rumbo", category: "Llaveros", description: "Punta de flecha plateada y flecos de gamuza en verde y azul. Para tus llaves o tu mochila.", price: 5600 }
    ];

    const WA_NUMBER = "5493794086517";
    const categories = ["Todos", "Pulseras", "Collares", "Colgantes", "Llaveros"];
    let activeCategory = "Todos";

    function imgKey(code) { return code.replace("-",""); }

    function money(v) {
      return new Intl.NumberFormat("es-AR", { style: "currency", currency: "ARS", maximumFractionDigits: 0 }).format(v);
    }

    function waLink(productName, code) {
      const msg = encodeURIComponent(`Hola, vi el catálogo y me interesa: ${productName} (${code})`);
      return `https://wa.me/${WA_NUMBER}?text=${msg}`;
    }

    function renderCats() {
      const nav = document.getElementById("categories");
      nav.innerHTML = "";
      categories.forEach(c => {
        const b = document.createElement("button");
        b.className = "cat-btn" + (activeCategory === c ? " active" : "");
        b.textContent = c;
        b.onclick = () => { activeCategory = c; renderCats(); renderProducts(); };
        nav.appendChild(b);
      });
    }

    function renderProducts() {
      const term = document.getElementById("search").value.trim().toLowerCase();
      let visible = products.filter(p => {
        const matchCat = activeCategory === "Todos" || p.category === activeCategory;
        const matchTerm = (p.name + p.code + p.description).toLowerCase().includes(term);
        return matchCat && matchTerm;
      });

      const label = document.getElementById("count-label");
      label.textContent = activeCategory === "Todos"
        ? `Todos los productos (${visible.length})`
        : `${activeCategory} (${visible.length})`;

      const grid = document.getElementById("catalog");
      grid.innerHTML = "";

      if (!visible.length) {
        grid.innerHTML = '<p class="empty">No encontramos productos con esa búsqueda.</p>';
        return;
      }

      visible.forEach(p => {
        const key = imgKey(p.code);
        const imgSrc = IMGS[key] || "";
        const priceHtml = p.price === null
          ? '<span class="price-pending">Precio próximamente</span>'
          : `<div class="card-price">${money(p.price)}</div>`;

        const card = document.createElement("article");
        card.className = "card";
        card.innerHTML = `
          ${imgSrc ? `<img class="card-img" src="${imgSrc}" alt="${p.name}" loading="lazy">` : `<div class="card-img" style="background:#f0ede8;display:flex;align-items:center;justify-content:center;color:#c9c6be;font-size:2rem;">◈</div>`}
          <div class="card-body">
            <div class="card-code">${p.code}</div>
            <h3></h3>
            <p class="card-desc"></p>
            ${priceHtml}
            <a href="${waLink(p.name, p.code)}" target="_blank" rel="noopener"
               style="display:block;margin-top:10px;background:#25D366;color:white;text-align:center;padding:8px;border-radius:7px;font-size:.82rem;font-weight:600;text-decoration:none;">
              Pedir por WhatsApp
            </a>
          </div>`;
        card.querySelector("h3").textContent = p.name;
        card.querySelector(".card-desc").textContent = p.description;
        grid.appendChild(card);
      });
    }

    document.getElementById("search").addEventListener("input", renderProducts);
    renderCats();
    renderProducts();
  </script>
